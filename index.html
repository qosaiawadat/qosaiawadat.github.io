.pane.bah[data-state="dusk"]  { --sky1: #875848; --sky2: #B2876F; --far: #74463A; --near: #44261B; --glow: rgba(235,175,125,.5); }
.pane.bah[data-state="night"] { --sky1: #382A27; --sky2: #503A35; --far: #3C2924; --near: #1B110E; --glow: rgba(200,176,138,.32); }

.pane.lon[data-state="night"] { --sky1: #222B2E; --sky2: #36434A; --far: #2A363B; --near: #111A1E; --glow: rgba(200,176,138,.3); }

.divider { position: absolute; z-index: 2; top: -3vh; bottom: -3vh; left: var(--x); width: 1px; background: rgba(246,241,232,.5); transform: translateX(-50%) skewX(var(--deg)); pointer-events: none; }

.stage { position: absolute; inset: 0; z-index: 3; display: grid; grid-template-rows: auto 1fr auto; padding: calc(1.1rem + env(safe-area-inset-top, 0px)) var(--gutter) 0; pointer-events: none; }

/* the paper cover, and the ink drawing that becomes the skyline */
.cover { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
.cover i, .cover b { position: absolute; display: block; }
.cover i { inset: -1px; background: var(--linen); }
.cover .l { clip-path: polygon(0 0, calc(50% + var(--s) + 1px) 0, calc(50% - var(--s) + 1px) 100%, 0 100%); }

/* ---- Arrival: the seam, the ink drawing, the flood of colour, the words ---- */
@keyframes seam-draw { to { transform: translateX(-50%) skewX(var(--deg)) scaleY(1); } }

@keyframes fade-in { from { opacity: 0; } }
@keyframes cover-l { to { transform: translateX(-101%); } }
@keyframes cover-r { to { transform: translateX(101%); } }
@keyframes cover-u { to { transform: translateY(-101%); } }
@keyframes cover-d { to { transform: translateY(101%); } }
@keyframes rise-in { from { opacity: 0; transform: translateY(18%); } }

.one .w { animation: word-in .8s var(--ease) calc(2.2s + var(--i) * 45ms) both; }
.top, .bottom { animation: soft-in 1s var(--ease) 2.3s both; }
.divider { animation: fade-in 1s var(--ease) 2s both; }
.giant .ch { animation: rise-ch 1s var(--ease) calc(.15s + var(--i) * 40ms) both; }
.giant .fill { animation: sweep-l 1.5s var(--ease) 1s backwards; } .giant .ghost { animation: sweep-r 1.5s var(--ease) 1s backwards; }
.bar, .lede { animation: soft-in 1s var(--ease) .5s both; }
@media (max-aspect-ratio: 4/5) {
  .cover .seam { animation-name: seam-draw-h, fade-out; }
  .cover .l { animation-name: cover-u; } .cover .r { animation-name: cover-d; }
}

/* ---- Pages ---- */
.dark { background: var(--ink); color: var(--linen); }
.dark .nav a { opacity: .78; }
.hero { padding: clamp(1.5rem, 5vh, 3.5rem) var(--gutter) 0; display: grid; gap: .6rem; }
.giant { position: relative; --x: 60%; --s: 3vw; font-size: var(--fs); line-height: .86; overflow: hidden; padding: .05em 0 .07em; margin: 0 -.02em; }
.giant h1, .giant .ghost { white-space: nowrap; font-size: inherit; font-weight: inherit; }
.giant .fill { position: relative; clip-path: polygon(0 0, calc(var(--x) + var(--s)) 0, calc(var(--x) - var(--s)) 100%, 0 100%); transition: clip-path .6s var(--ease); }
.giant .ghost { clip-path: polygon(calc(var(--x) + var(--s)) 0, 100% 0, 100% 100%, calc(var(--x) - var(--s)) 100%); transition: clip-path .6s var(--ease); }
.about .giant { --fs: min(38vw, 30rem); } .projects .giant { --fs: min(24.5vw, 19rem); } .notfound .giant { --fs: min(22vw, 17rem); }
.lede { font-size: clamp(1.4rem, 1rem + 1.6vw, 2.4rem); color: var(--mute); line-height: 1.2; }
.dark .lede { color: rgba(238,231,219,.6); }
.statement { padding: clamp(2rem, 7vh, 5.5rem) var(--gutter) clamp(3rem, 10vh, 7rem); max-width: 72rem; }
.statement p { font-size: clamp(1.45rem, 1rem + 2.5vw, 3.1rem); line-height: 1.16; letter-spacing: -.02em; font-weight: 500; text-wrap: pretty; }
.statement .w { color: rgba(238,231,219,.32); transition: color .55s var(--ease); } .statement .w.lit { color: var(--linen); }
.statement .w.it { font-size: 1.08em; font-weight: 400; letter-spacing: 0; } .statement .w.it.lit { color: var(--sand); }
.page { padding-bottom: clamp(1rem, 3vh, 2rem); }
.section { display: grid; gap: 1.2rem; padding: clamp(2.2rem, 5vh, 3.6rem) var(--gutter); border-top: 1px solid var(--line); }
.kicker { display: block; font-family: var(--serif); font-style: italic; font-size: 1.25rem; color: var(--mute); margin-bottom: .35rem; }
.section h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: clamp(2.4rem, 5.5vw, 4.4rem); line-height: .92; letter-spacing: .01em; }
@media (min-width: 60rem) { .section { grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 2rem 4rem; align-items: start; } .section .head { position: sticky; top: 2rem; } }
.list li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem 1rem; padding: .75rem 0; border-top: 1px solid var(--line); }
.list li:last-child { border-bottom: 1px solid var(--line); }
.list a, .list .soon { font-weight: 500; font-size: 1.25rem; }
.list a { background: linear-gradient(currentColor, currentColor) no-repeat 0 100% / 0 1px; transition: background-size .5s var(--ease); }
.list a:hover { background-size: 100% 1px; }
.list .soon { color: var(--mute); } .list small { color: var(--mute); font-size: .95rem; margin-left: auto; }
.rows { padding: 0 var(--gutter); }
.row { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; grid-template-areas: "i t a" "i d a"; align-items: center; gap: .3rem 1rem; padding: clamp(1.4rem, 4vh, 2.4rem) 0; border-top: 1px solid var(--line); }
.rows li:last-child .row { border-bottom: 1px solid var(--line); }
.row .idx { grid-area: i; font-size: 1.3rem; color: var(--mute); align-self: start; padding-top: .3em; }
.row .ttl { grid-area: t; text-transform: none; font-size: clamp(2.6rem, 8vw, 7rem); line-height: .95; -webkit-text-stroke: .014em currentColor; -webkit-text-fill-color: transparent; transition: -webkit-text-fill-color .5s var(--ease), transform .7s var(--ease); }
.row .desc { grid-area: d; font-size: clamp(1.15rem, 1rem + .7vw, 1.6rem); color: var(--mute); }
.row .arr { grid-area: a; width: clamp(2rem, 4vw, 3.2rem); height: clamp(2rem, 4vw, 3.2rem); transition: transform .5s var(--ease); }
.row:hover .ttl { -webkit-text-fill-color: currentColor; transform: translateX(.25em); }
.row:hover .arr { transform: translate(.25em, -.25em); }
@media (max-width: 48rem) { .row { grid-template-columns: 2rem minmax(0, 1fr) auto; } }
.js .reveal { opacity: 0; transform: translateY(1.4rem); transition: opacity .9s var(--ease), transform .9s var(--ease); transition-delay: calc(var(--i, 0) * 80ms); }
.js .reveal.in { opacity: 1; transform: none; }
.prose { font-size: clamp(1.15rem, 1rem + .6vw, 1.5rem); line-height: 1.45; letter-spacing: -.01em; max-width: 34em; padding: 0 var(--gutter); }
.prose a { text-decoration: underline; text-underline-offset: .15em; }

/* ---- The journey: contour lines, a route that draws itself, a photo for every stage ---- */
.journey { position: relative; padding: clamp(3rem, 8vh, 6rem) var(--gutter) clamp(4rem, 10vh, 8rem); overflow: hidden; background: linear-gradient(to bottom, var(--ink) 0, var(--ink) var(--a, 40%), var(--linen) var(--b, 60%)); }
.contours { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; fill: none; stroke: var(--sand); stroke-width: 1; opacity: .3; pointer-events: none; }
.jhead { position: relative; z-index: 1; max-width: 40rem; margin-bottom: clamp(2rem, 6vh, 4rem); color: var(--linen); }
.jhead .kicker { color: rgba(238,231,219,.6); }
.jhead h2 { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: clamp(2.4rem, 5.5vw, 4.4rem); line-height: .92; }
.stages { position: relative; z-index: 1; display: flex; flex-direction: column; }
.route { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: visible; pointer-events: none; }
.route path { fill: none; stroke: var(--sand); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.route circle { fill: var(--sand); stroke: var(--linen); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.3); transition: opacity .5s, transform .6s var(--ease); } .route circle.on { opacity: 1; transform: none; }
.stage-card { position: relative; z-index: 1; width: 34%; display: grid; gap: .8rem; }
.stage-card:nth-of-type(1) { margin-left: 8%; }
.stage-card:nth-of-type(2) { align-self: flex-end; width: 30%; margin-right: 6%; margin-top: -14vh; }
.stage-card:nth-of-type(3) { width: 27%; margin-left: 18%; margin-top: -4vh; }
.stage-card:nth-of-type(4) { align-self: flex-end; width: 40%; margin-right: 8%; margin-top: -12vh; }
.stage-card:nth-of-type(5) { width: 32%; margin-left: 6%; margin-top: -6vh; }
.stage-card.dk { color: var(--linen); } .stage-card.dk .lbl, .stage-card.dk .role { color: rgba(238,231,219,.65); }
.poster { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: .4rem; box-shadow: 0 1px 0 rgba(43,39,36,.12); }
.stage-card:nth-of-type(2) .poster { aspect-ratio: 3 / 4; } .stage-card:nth-of-type(4) .poster { aspect-ratio: 5 / 4; }
.poster .pane { --gr: 0px; } .poster .skyline.near { height: 56%; } .poster .skyline.far { height: 64%; }
.poster .cirrus { animation: none; }
.lbl { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.org { font-family: var(--display); text-transform: uppercase; font-weight: 800; font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.6rem); line-height: .95; letter-spacing: .02em; }
.role { font-family: var(--serif); font-style: italic; font-size: 1.2rem; color: var(--mute); }
@media (max-width: 48rem) {
  .stage-card, .stage-card:nth-of-type(n) { width: 76%; margin: 0 0 3.5rem; }
  .stage-card:nth-of-type(even) { align-self: flex-end; }
}

/* the horizon: that page's city, at the bottom */
.horizon { position: relative; height: clamp(15rem, 38vh, 24rem); margin-top: clamp(2rem, 6vh, 4rem); overflow: hidden; color: var(--lin2); clip-path: polygon(0 3vw, 100% 0, 100% 100%, 0 100%); }
.horizon .pane { --gr: 3.4rem; }
.horizon .skyline.near { height: clamp(5rem, 20vh, 10rem); } .horizon .skyline.far { height: clamp(6rem, 23vh, 12rem); }
.hz { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 0; height: 3.4rem; z-index: 3; display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0 clamp(.75rem, 2.5vw, 2.5rem); }
.hz .cities, .hz .copy { grid-column: auto; }

/* ---- Tap burst + a trailing ring on desktop ---- */
.burst { position: fixed; z-index: 30; left: 0; top: 0; width: 0; height: 0; pointer-events: none; }
.burst i { position: absolute; left: 0; top: 0; border-radius: 50%; will-change: transform; }
.cursor { position: fixed; left: 0; top: 0; z-index: 60; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; box-shadow: inset 0 0 0 1px #fff; mix-blend-mode: difference; pointer-events: none; opacity: 0; transition: width .4s var(--ease), height .4s var(--ease), margin .4s var(--ease), opacity .3s, box-shadow .3s; }
.cursor.show { opacity: 1; }
.cursor.on { width: 52px; height: 52px; margin: -26px 0 0 -26px; box-shadow: inset 0 0 0 1.5px #fff; }

/* ---- Page change: the two skies close over the page, then part for the next ---- */
.curtain { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; pointer-events: none; visibility: hidden; color: var(--lin2); --s: 4vh; }
.curtain i { position: absolute; inset: -1px; display: block; transition: transform .75s var(--ease); }
.curtain .cl { background: #6A8397; clip-path: polygon(0 0, calc(50% + var(--s) + 2px) 0, calc(50% - var(--s) + 2px) 100%, 0 100%); transform: translateX(-101%); }
.curtain .cr { background: #A97361; clip-path: polygon(calc(50% + var(--s)) 0, 100% 0, 100% 100%, calc(50% - var(--s)) 100%); transform: translateX(101%); }
.curtain span { position: relative; white-space: nowrap; font-size: min(18vw, 22vh); opacity: 0; transform: translateY(30%); transition: transform .9s var(--ease) .2s, opacity .5s ease .2s; }
.curtain span.long { font-size: min(13.5vw, 17vh); }
.curtain.in { visibility: visible; } .curtain.in i { transform: none; } .curtain.in span { opacity: 1; transform: none; }
.curtain.in .cl { view-transition-name: cl; } .curtain.in .cr { view-transition-name: cr; } .curtain.in span { view-transition-name: cw; }
@keyframes cl-out { to { transform: translateX(-101%); } }
@keyframes cr-out { to { transform: translateX(101%); } }
@keyframes cw-out { to { opacity: 0; transform: translateY(-40%); } }
@keyframes root-out { to { opacity: .4; } }
@keyframes root-in { from { opacity: 0; transform: scale(.985); } }
@view-transition { navigation: auto; }
::view-transition-old(root) { animation: root-out .6s var(--ease) both; }
::view-transition-new(root) { animation: root-in .9s var(--ease) both; }
::view-transition-old(cl) { animation: cl-out .85s var(--ease) .05s both; }
::view-transition-old(cr) { animation: cr-out .85s var(--ease) .05s both; }
::view-transition-old(cw) { animation: cw-out .5s var(--ease) both; }
</style>

    document.addEventListener('click', function (e) {
      var a = e.target.closest('a[data-page]');
      if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button || a.getAttribute('aria-current')) return;
      e.preventDefault(); word.textContent = a.getAttribute('data-page'); word.classList.toggle('long', word.textContent.length > 8); curtain.classList.add('in');
      setTimeout(function () { location.href = a.href; }, 820);
    });
    window.addEventListener('pageshow', function () { curtain.classList.remove('in'); });
  }
})();
</script>
</body>
</html>
