@font-face { font-family: "Inter Tight"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(/fonts/inter-tight.woff2) format("woff2"); }
:root {
  --paper: #0B1017; --ink: #E8E2D6; --ink-2: #8A94A3;
  --blue: #3D7BFF; --blue-soft: rgba(61,123,255,.16); --line: rgba(232,226,214,.09);
  --gutter: clamp(1.25rem, 5vw, 4.5rem);
  --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .7, .2, 1);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
html, body { overflow-x: clip; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--display); font-size: 1.0625rem; line-height: 1.6; }
::selection { background: var(--blue); color: #fff; }
a { color: inherit; }
a:focus-visible { outline: 2px solid var(--blue); outline-offset: .2em; border-radius: 2px; }
.w1 { --fill: var(--ink); } .w2 { --fill: var(--blue); }
.mono { font-family: var(--mono); font-size: .75rem; letter-spacing: .06em; color: var(--ink-2); }

/* Atmosphere: two glows that drift on scroll, film grain over everything, a progress hairline. */
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.sun { position: absolute; display: block; width: 90vmax; height: 90vmax; border-radius: 50%; background: radial-gradient(circle, var(--c) 0, transparent 60%); will-change: transform; }
.sun.a { --c: rgba(61,123,255,.28); top: -52vmax; left: -36vmax; }
.sun.b { --c: rgba(140,120,90,.16); bottom: -56vmax; right: -36vmax; }
.grain { position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: .09; background-image: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='220'%20height='220'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='.85'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20values='0%200%200%200%201%200%200%200%200%201%200%200%200%200%201%200%200%200%201%200'/%3E%3C/filter%3E%3Crect%20width='100%'%20height='100%'%20filter='url(#n)'/%3E%3C/svg%3E"); background-size: 220px 220px; }
.progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; z-index: 4; width: 100%; height: 2px; background: var(--blue); transform-origin: 0 50%; transform: scaleX(0); }
.glow { position: fixed; top: 0; left: 0; z-index: 1; width: 40vmax; height: 40vmax; margin: -20vmax 0 0 -20vmax; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, var(--blue-soft), transparent 60%); will-change: transform; transition: transform .4s var(--ease); }

/* Hero */
.hero { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto auto; gap: 1.5rem; padding: clamp(1rem, 3vh, 2rem) var(--gutter) 6vh; }
.topbar { display: flex; justify-content: space-between; align-items: baseline; }
.topbar nav { display: flex; gap: 1.5rem; }
.topbar a { font-weight: 500; font-size: 1.125rem; text-decoration: none; transition: color .3s; }
.topbar a:hover { color: var(--blue); }
.name { grid-row: 3; margin: 0; font-weight: 500; font-size: min(23vw, 20vh); line-height: .9; letter-spacing: -.03em; view-transition-name: name; }
.name .w { display: block; white-space: nowrap; }
.name .l { display: inline-block; }
.w2 .l { color: var(--blue); }
.intro { grid-row: 4; display: grid; gap: .75rem; }
.lede { margin: 0; max-width: 26em; font-size: clamp(1.0625rem, .8rem + 1vw, 1.375rem); color: var(--ink-2); }
.meta { display: flex; flex-wrap: wrap; gap: .25rem 1.5rem; margin: 0; }
@media (min-width: 64rem) { .name { font-size: min(23vw, 32vh); } }

/* Profiles */
.profiles { padding: 12vh var(--gutter); }
.profiles + .profiles { padding-top: 0; }
.profiles h2 { margin: 0 0 1.25rem; font-weight: 500; font-size: 1.125rem; color: var(--ink-2); }
.profiles ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.profiles li { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
.roll { position: relative; display: inline-block; overflow: hidden; font-weight: 500; font-size: clamp(2.25rem, 6.5vw, 4rem); line-height: 1.1; letter-spacing: -.02em; text-decoration: none; padding-bottom: .04em; margin-bottom: -.04em; }
.roll > span { display: block; transition: transform .55s var(--ease); }
.roll::after { content: attr(data-text); position: absolute; left: 0; top: 100%; display: block; color: var(--blue); transition: transform .55s var(--ease); }
.roll:hover > span, .roll:focus-visible > span, .roll:hover::after, .roll:focus-visible::after { transform: translateY(-100%); }
.profiles small { margin-left: auto; }
.roll.soon { color: var(--ink-2); pointer-events: none; }
.links-sm li { padding: .9rem 0; }
.links-sm .roll { font-size: clamp(1.25rem, 1rem + 1.25vw, 1.75rem); letter-spacing: -.01em; }

footer { padding: 0 var(--gutter) 10vh; max-width: 40em; font-size: .9375rem; color: var(--ink-2); }
footer p { margin: 0; }

/* About page */
.abt-top { display: flex; justify-content: space-between; align-items: baseline; padding: clamp(1rem, 3vh, 2rem) var(--gutter) 0; }
.abt-top nav { display: flex; gap: 1.5rem; }
.abt-top a { font-weight: 500; font-size: 1.125rem; text-decoration: none; transition: color .3s; }
.abt-top a:hover { color: var(--blue); }
.name-sm { font-weight: 600; font-size: 1.25rem; letter-spacing: -.02em; view-transition-name: name; }
.abt-hero { min-height: calc(100svh - 6rem); display: grid; align-content: end; gap: 1rem; padding: 8vh var(--gutter) 10vh; }
.abt-title { margin: 0; font-weight: 600; font-size: clamp(2.75rem, 11vw, 8rem); line-height: .92; letter-spacing: -.04em; }
.abt-title em { font-style: normal; color: var(--blue); }
.abt-hero.short { min-height: 0; padding-bottom: 2vh; }
.abt-hero.tall { min-height: calc(100svh - 6rem); }
.abt-hero.short .abt-title { font-size: clamp(2.25rem, 9vw, 6rem); }

/* Curtain used when changing page */
.curtain { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow: hidden; pointer-events: none; background: var(--blue); transform: translateY(100%); transition: transform .55s var(--ease); }
.curtain.in { transform: translateY(0); view-transition-name: curtain; }
.curtain span { font-weight: 500; font-size: min(17vw, 24vh); line-height: 1; letter-spacing: -.04em; color: transparent; -webkit-text-stroke: 1.5px rgba(255,255,255,.9); transform: translateY(25%); transition: transform .8s var(--ease) .08s; }
.curtain.in span { transform: none; }

/* ---- Motion ---- */
@keyframes rise   { from { transform: translateY(.4em); } }
@keyframes fade   { from { opacity: 0; } }
@keyframes heavy  { to { font-weight: 600; color: var(--fill); -webkit-text-stroke-color: var(--fill); } }
@keyframes enter  { from { font-weight: 100; transform: translateX(-.5em); } }
@keyframes driftA { to { transform: translate(30vmax, 80vmax); } }
@keyframes driftB { to { transform: translate(-24vmax, -80vmax); } }
@keyframes grow   { to { transform: scaleX(1); } }
@keyframes curtain-exit { to { transform: translateY(-100%); } }
@keyframes root-out { to { opacity: .35; transform: scale(.96) translateY(-2vh); } }

@media (prefers-reduced-motion: no-preference) {
  @view-transition { navigation: auto; }
  .name .l { animation: rise .8s var(--ease) both; animation-delay: calc(var(--i) * 35ms); }
  .intro, .topbar { animation: fade .9s ease-out .3s both; }

  @supports (animation-timeline: scroll()) {
    .name .l {
      font-weight: 100; color: transparent; -webkit-text-stroke: 1px var(--ink);
      animation: rise .8s var(--ease) both, heavy linear both;
      animation-delay: calc(var(--i) * 35ms), 0s;
      animation-timeline: auto, scroll(root);
      animation-range: normal, calc(var(--i) * 3vh) calc(var(--i) * 3vh + 40vh);
    }
    .w2 .l { -webkit-text-stroke-color: var(--blue); }
    .progress { animation: grow linear both; animation-timeline: scroll(root); }
    .sun.a { animation: driftA linear both; animation-timeline: scroll(root); }
    .sun.b { animation: driftB linear both; animation-timeline: scroll(root); }
    .profiles .roll { animation: enter linear both; animation-timeline: view(); animation-range: entry 0% entry 80%; }
  }

  .abt-title { animation: rise .8s var(--ease) .45s both; }
  .abt-hero .lede { animation: fade .8s ease-out .65s both; }
  ::view-transition-old(root) { animation: root-out .5s var(--ease) both; }
  ::view-transition-new(root) { animation: none; opacity: 1; }
  ::view-transition-old(curtain) { animation: curtain-exit .65s var(--ease) both; }
  ::view-transition-group(name) { animation-duration: .65s; animation-timing-function: var(--ease); }
}
@media (prefers-reduced-motion: reduce) {
  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}

<script>
(function () {
  var curtain = document.querySelector('.curtain'), word = curtain.querySelector('span');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Page change: raise the curtain, then navigate. The next page opts in to a cross-document view transition,
  // so the curtain captured here lifts away over the new page and the name morphs into its new place.
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-page]');
    if (!a || reduce || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
    e.preventDefault();
    word.textContent = a.getAttribute('data-page');
    curtain.classList.add('in');
    setTimeout(function () { location.href = a.href; }, 600);
  });
  window.addEventListener('pageshow', function () { curtain.classList.remove('in'); });
  // Desktop only: a soft blue glow follows the pointer. Phones never create it.
  if (window.matchMedia('(pointer: fine)').matches && !reduce) {
    var g = document.createElement('div'); g.className = 'glow'; document.body.appendChild(g);
    window.addEventListener('pointermove', function (e) { g.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)'; }, { passive: true });
  }
})();
